  --night:#0A0720;--panel:#1E1448;--line:#4B3A8C;
  --gold:#F8C838;--gold2:#FFF0B0;--golddk:#A86A14;--red:#E8453C;--green:#40D070;--blue:#58A8F8;--ink:#FFF6E0;--mute:#A89CD8;

body{background:#000;color:var(--ink);font-family:var(--tc);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

#hud{position:absolute;top:0;left:0;right:0;padding:8px 10px 0;display:flex;flex-direction:column;gap:5px;pointer-events:none;font-family:var(--px);font-size:10px;text-shadow:2px 2px 0 #000}
#hud .top{display:flex;align-items:center;gap:8px}
#hCoins{color:var(--gold2)}#hWave{color:var(--mute)}
#hScore{margin-left:auto;font-size:12px;color:#fff}
#bPause{pointer-events:auto;width:30px;height:26px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font:8px var(--px);cursor:pointer;box-shadow:2px 2px 0 #000}
#hHp{display:flex;gap:3px}
#hHp i{width:10px;height:10px;background:var(--red);box-shadow:inset -2px -2px 0 #8C1A14}
#hHp i.off{background:#3A2A5A;box-shadow:none}
#hBuff{display:flex;gap:4px;flex-wrap:wrap}
#hBuff span{background:#000;border:1px solid var(--line);padding:2px 4px;font-size:7px}
#hBuff span.bad{border-color:var(--red);color:#FF9A94}
#hBuff span.good{border-color:var(--green);color:#9AF0B4}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px 16px;background:rgba(10,7,32,.86);text-align:center;overflow-y:auto}
.ov.scroll{justify-content:flex-start}
.ov.clear{background:transparent;justify-content:flex-end;padding-bottom:28px}
.brand{font-family:var(--px);font-size:26px;line-height:1.3;color:var(--gold);text-shadow:3px 3px 0 var(--golddk),6px 6px 0 #000}
.h1{font-weight:900;font-size:26px;letter-spacing:.12em;text-shadow:3px 3px 0 #000}
.tag{font-family:var(--px);font-size:8px;color:var(--gold2);background:var(--red);padding:5px 8px;box-shadow:3px 3px 0 #000}
.sub{color:var(--ink);font-size:13px;max-width:30ch;line-height:1.6;text-wrap:balance;text-shadow:1px 1px 0 #000}
.wallet{display:flex;gap:8px;align-items:center;font-family:var(--px);font-size:14px;background:#000;border:2px solid var(--gold);padding:8px 14px;color:var(--gold2)}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:900 16px var(--tc);letter-spacing:.1em;border:3px solid #000;padding:12px 16px;background:var(--gold);color:#2A1A00;box-shadow:4px 4px 0 #000;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.big{font-size:20px;padding:14px}
.btn.green{background:var(--green);color:#04291B}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.small{font-size:12px;padding:7px 10px;box-shadow:3px 3px 0 #000;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible,#bPause:focus-visible,.chk:focus-within,input:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.chk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;background:var(--panel);border:2px solid var(--line);padding:9px 12px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--green)}
.fine{font-size:11px;color:var(--mute);max-width:36ch;line-height:1.6}
.best{font-family:var(--px);font-size:9px;color:var(--mute)}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

.shopHead{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:400px}
.shopHead h2{margin:0;font-size:22px;font-weight:900;letter-spacing:.14em}
.label{font-family:var(--px);font-size:8px;color:var(--gold);width:100%;max-width:400px;text-align:left;margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:10px 12px;text-align:left}
.row b{font-size:15px}
.row small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.pips{display:flex;gap:3px;margin-top:6px}
.pips span{width:14px;height:6px;background:#0A0620}
.pips span.on{background:var(--green)}
.jets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:400px}
.jet{background:var(--panel);border:2px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.jet.sel{border-color:var(--gold);background:#2A1E5C}
.jet img{width:60px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #000)}
.jet b{font-size:13px}
.jet small{font-size:10px;color:var(--mute);line-height:1.5}
.coinRow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:8px 10px;text-align:left;font-size:12px}
.coinRow canvas{width:36px;height:36px;image-rendering:pixelated}
.coinRow b{font-family:var(--px);font-size:9px}
.coinRow small{color:var(--mute);display:block;margin-top:3px}
.coinRow.bad{border-color:#C0392B}.coinRow.rare{border-color:var(--green)}.coinRow.shiny{border-color:#fff;background:linear-gradient(90deg,#2A1C5E,#4A1C5E)}
.mon{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:8px 10px;text-align:left;font-size:12px}
.mon canvas{width:40px;height:40px;image-rendering:pixelated}
.mon b{font-size:13px}.mon small{color:var(--mute);display:block}

.bigScore{font-family:var(--px);font-size:30px;color:var(--gold2);text-shadow:3px 3px 0 #000}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
.stat{background:var(--panel);border:2px solid var(--line);padding:8px}
.stat small{display:block;color:var(--mute);font-size:11px}
.stat .px{font-size:12px}
.newbest{color:var(--green);font-family:var(--px);font-size:10px}
.nameBox{display:flex;gap:8px;width:100%;max-width:300px}
.nameBox input{flex:1;min-width:0;font:900 16px var(--tc);padding:10px;border:3px solid #000;background:#fff;color:#000}
table.lb{width:100%;max-width:400px;border-collapse:collapse;font-size:13px}
table.lb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.lb td.n{font-family:var(--px);font-size:9px;color:var(--gold)}
table.lb td.s{font-family:var(--px);font-size:10px;text-align:right}
table.lb tr.me td{background:#2A1E5C}
#toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:var(--green);color:#04291B;font-weight:900;padding:8px 14px;border:3px solid #000;font-size:13px;pointer-events:none;opacity:0;white-space:nowrap}
#toast.show{opacity:1}
</style>

<div id="app">
  <canvas id="cv" aria-label="遊戲畫面"></canvas>
  <div id="crt"></div>

  <div id="hud" hidden>
    <div class="top">
      <span><i class="ci"></i> <span id="hCoins">0</span></span>
      <span id="hWave">L1</span>
      <span id="hScore">0</span>
      <button id="bPause" aria-label="暫停">II</button>
    </div>
    <div id="hHp"></div>
    <div id="hBuff"></div>
  </div>

  <div id="home" class="ov clear">
    <div class="brand">10K DOG</div>
    <div class="h1">金狗射熊</div>
    <div class="tag">穿越地球・抵達 10K DOG 星</div>

let stars=[],far=[];
function initBg(){stars=Array.from({length:60},()=>({x:Math.random()*W|0,y:Math.random()*H|0,v:Math.random()*18+8,b:Math.random()<.3}));far=Array.from({length:25},()=>({x:Math.random()*W|0,y:Math.random()*H|0,v:3}))}
function circle(x,y,r,col){cx.fillStyle=col;for(let yy=-r;yy<=r;yy++){const w=Math.sqrt(r*r-yy*yy)|0;cx.fillRect(x-w,y+yy,w*2,1)}}
function drawSpace(dt,prog,dark){
  cx.fillStyle='#0A0720';cx.fillRect(0,0,W,H);
  cx.fillStyle='#4A3F7A';for(const s of far){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W|0}cx.fillRect(s.x,s.y|0,1,1)}
  for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W|0}cx.fillStyle=s.b?'#FFF6E0':'#8C86B8';cx.fillRect(s.x,s.y|0,s.b?2:1,s.b?2:1)}
  // 地球（起點）喺底、10K DOG 星喺頂：隨進度移動
  const ey=H+40-prog*90;if(ey<H+60){circle(W/2,ey|0,60,'#1E4E8C');circle(W/2-18,ey-30|0,14,'#40D070');circle(W/2+22,ey-20|0,10,'#40D070');circle(W/2+5,ey-45|0,6,'#40D070')}
  const py=-60+prog*110,dim=1-dark*.8;if(py>-40){circle(W/2,py|0,26,`rgb(${248*dim|0},${200*dim|0},${56*dim|0})`);circle(W/2-8,py-6|0,5,`rgb(${255*dim|0},${240*dim|0},${176*dim|0})`);
    if(img.coinB&&img.coinB.complete){cx.globalAlpha=dim;cx.drawImage(img.coinB,W/2-9,py-9|0);cx.globalAlpha=1}
    cx.fillStyle='#FFF0B0';cx.font='7px "Press Start 2P",monospace';cx.textAlign='center';cx.fillText('10K DOG',W/2,py+38)}
}

/* ---------- 遊戲 ---------- */
let mode='home',G=null;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.random()*arr.length|0];
function newRun(){
  let mult=1;if($('boost').checked&&S.coins>=40){S.coins-=40;mult=2;save()}$('boost').checked=false;
  const J=jetOf(S.jet),hp=Math.max(1,3+S.up.hp+J.hp);
  G={J,p:{x:W/2,y:H-60,hp,max:hp,inv:1.5,ft:0},b:[],e:[],eb:[],d:[],fx:[],tx:[],buf:{},shield:0,
     score:0,coins:0,lvl:1,wt:0,st:1,boss:null,bossDone:false,warn:0,warned:false,mult,revived:false,t:0,banner:2.4,shake:0,candleT:2,freeze:0,flash:0,shinyGot:[],shinyOn:0,dealerT:rnd(4,9),dealerDone:false,planeT:6,sickleT:8,won:false};
}
function nextLevel(){if(G.lvl>=LEVELS){win();return}G.lvl++;G.wt=0;G.st=1.2;G.banner=2.4;G.boss=null;G.bossDone=false;G.warned=false;G.warn=0;G.dealerT=rnd(3,8);G.dealerDone=false;G.planeT=5;G.sickleT=7}
const has=k=>G.buf[k]>0;
function fireInt(){let f=(.2-S.up.rate*.022)/G.J.rate;if(has('rapid'))f*=.5;if(has('moon'))f*=.75;return f}
const PAT=[[0],[-4,4],[-6,0,6],[-8,-3,3,8],[-9,-4,0,4,9],[-11,-5,0,5,11]];
function shoot(){
  const lv=has('weak')?0:S.up.power,dmg=(1+lv*.2)*G.J.dmg*(has('weak')?.5:1),p=G.p;
  for(const o of PAT[lv])G.b.push({x:p.x+o,y:p.y-14,vx:lv>=4?o*3:0,vy:-320,dmg});
  if(has('spread')){for(const a of[-1,1]){G.b.push({x:p.x,y:p.y-12,vx:a*110,vy:-290,dmg,g:1});G.b.push({x:p.x,y:p.y-12,vx:a*60,vy:-310,dmg,g:1})}}
}
function mkE(o){o.max=o.hp;o.hf=0;G.e.push(o);return o}
function spawnEnemy(){
  const n=G.lvl,r=Math.random(),x=rnd(12,W-12);
  if(r<.3)mkE({t:'candle',x,y:-14,r:5,hp:1+n*.3,vy:95+n*7,score:10,coin:1});
  else if(r<.45)mkE({t:'wick',x,bx:x,y:-14,r:4,hp:1+n*.2,vy:150+n*10,ph:rnd(0,6),score:15,coin:1});
  else if(r<.45+Math.min(.25,.05*n))mkE({t:'bomb',x,bx:x,y:-20,r:9,hp:8+n*2.5,vy:18+n,ph:rnd(0,6),ft:rnd(1,2),score:60,coin:5});
  else mkE({t:'fud',x,bx:x,y:-12,r:7,hp:2+n*.7,vy:32+n*3,ph:rnd(0,6),amp:rnd(8,Math.min(35,W/5)),ft:rnd(1,3),score:20,coin:2});
}
function spawnPlane(){const dir=Math.random()<.5?1:-1;mkE({t:'plane',x:dir>0?-20:W+20,y:rnd(30,80),r:9,hp:6+G.lvl*2,vx:dir*(55+G.lvl*4),ft:.8,score:80,coin:4})}
function spawnSickle(){const dir=Math.random()<.5?1:-1;mkE({t:'sickle',x:dir>0?-20:W+20,y:rnd(H*.35,H*.7),r:7,hp:4+G.lvl,vx:dir*(70+G.lvl*6),rot:0,score:70,coin:3})}
function spawnDealer(){const n=G.lvl,sp=(80+n*28);mkE({t:'dealer',x:rnd(30,W-30),y:-20,r:8,hp:1e9,vx:sp*(Math.random()<.5?1:-1),vy:sp*.6,life:9+n,score:0,coin:0})}
function spawnBoss(kind){
  const n=G.lvl;G.boss=mkE({t:'boss',kind,x:W/2,y:-50,r:kind==='whale'?30:24,hp:150+n*50+(kind==='crab'?120:0),vy:0,ft:2,pat:0,score:400*n,coin:0});
}
function eShot(x,y,ang,sp,k){G.eb.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,k})}
function aim(e){return Math.atan2(G.p.y-e.y,G.p.x-e.x)}
function burst(x,y,col,n=10,sp=90){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(sp*.3,sp);G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.7),max:.7,col})}}
function floatText(x,y,txt,col,big){G.tx.push({x,y,txt,col,life:big?1.6:.9,big})}
function drop(k,x,y,c){G.d.push({k,x,y,vx:rnd(-35,35),vy:rnd(-70,-15),c,t:0})}
function lootFrom(e){
  const big=e.t==='bomb'||e.t==='plane'||e.t==='sickle',boss=e.t==='boss';
  for(let i=0;i<e.coin;i++)drop('coin',e.x+rnd(-4,4),e.y);
  const r=Math.random(),shinyP=boss?.4:big?.02:.004;
  if(r<shinyP){drop('shiny',e.x,e.y,pick(COINS.shiny));sfx.shiny();G.shinyOn=1;floatText(W/2,H*.3,'哇！！！閃光幣出現',"#fff",1);return}
  if(boss){for(let i=0;i<3;i++)drop('rare',e.x+rnd(-20,20),e.y,pick(COINS.rare));drop('bone',e.x,e.y);return}
  const rareP=big?.3:.07,comP=big?.5:.18,badP=big?.15:.09;
  if(r<shinyP+rareP)drop('rare',e.x,e.y,pick(COINS.rare));
  else if(r<shinyP+rareP+comP)drop('common',e.x,e.y,pick(COINS.common));
  else if(r<shinyP+rareP+comP+badP)drop('bad',e.x,e.y,pick(COINS.bad));
  else if(Math.random()<(big?.12:.025))drop('bone',e.x,e.y);
}
function kill(e){
  G.score+=e.score;
  if(e.t==='boss'){
    burst(e.x,e.y,'#E8453C',40,200);burst(e.x,e.y,'#F8C838',30,160);sfx.big();G.shake=.6;
    for(let i=0;i<25;i++)drop('coinB',e.x+rnd(-24,24),e.y+rnd(-16,16));
    lootFrom(e);floatText(e.x,e.y,MONS.find(m=>m.k===e.kind).name.split('（')[0]+' 已擊退！','#40D070',1);G.bossDone=true;
    setTimeout(()=>{if(G&&G.bossDone&&mode==='play')nextLevel()},1800);
  }else{burst(e.x,e.y,e.t==='candle'||e.t==='wick'?'#E8453C':'#F2B0A0',e.t==='bomb'?18:8,e.t==='bomb'?140:90);sfx.pop();lootFrom(e)}
}
function hurt(){
  const p=G.p;if(p.inv>0||has('ghost'))return;
  if(G.shield>0){G.shield=0;p.inv=1;burst(p.x,p.y,'#F3BA2F',16,120);floatText(p.x,p.y-14,'BNB 護盾抵擋','#F3BA2F');sfx.power();return}
  p.hp--;p.inv=1.6*G.J.inv;G.shake=.35;sfx.hit();burst(p.x,p.y,'#E8453C',16,120);
  if(p.hp<=0)gameOver(false);
}
function addCoins(n){const v=n*G.mult*(has('magnet')?2:1);S.coins+=v;G.coins+=v}
function applyCoin(d){
  const c=d.c,p=G.p;
  if(d.k==='common'){G.score+=50;addCoins(3);if(Math.random()<.25)p.hp=Math.min(p.max,p.hp+1);sfx.coin();floatText(d.x,d.y,c.t+' +50','#9FB4FF');return}
  if(d.k==='bad'){G.buf[c.key]=6;sfx.bad();G.shake=.2;floatText(d.x,d.y,c.t+'！'+c.fx.split(' ')[0],'#FF9A94');return}
  if(d.k==='rare'){if(c.key==='shield')G.shield=1;else G.buf[c.key]=c.key==='ghost'?4:8;sfx.power();floatText(d.x,d.y,c.t+' '+c.fx.split('：')[0].split(' ')[0],'#40D070');G.score+=100;return}
  if(d.k==='shiny'){
    G.freeze=1.4;G.flash=1;G.shake=.5;sfx.jackpot();G.shinyGot.push(c.t);S.shiny++;
    for(const e of G.e){if(e.t!=='boss'&&e.t!=='dealer'){e.dead=true;burst(e.x,e.y,'#fff',6,80)}}G.eb=[];
    if(c.key==='btc'){addCoins(150);for(const k of['spread','moon','magnet','rapid'])G.buf[k]=10;G.shield=1}else{p.max++;p.hp=p.max;G.buf.ghost=4}
    G.score+=1000;floatText(W/2,H*.45,'✦ '+c.t+' GET ✦','#FFF0B0',1);
  }
}
function update(dt){
  const p=G.p;G.t+=dt;
  if(G.freeze>0){G.freeze-=dt;G.flash=Math.max(0,G.flash-dt*.8);return}
  G.flash=Math.max(0,G.flash-dt*2);
  for(const k in G.buf)if(G.buf[k]>0)G.buf[k]-=dt;
  const spd=G.J.spd*(has('slow')?.5:1)*(has('moon')?1.35:1);
  let kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ky=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  if(kx||ky){p.x+=kx*170*spd*dt;p.y+=ky*170*spd*dt}
  if(dragV){p.x+=dragV.x*spd;p.y+=dragV.y*spd;dragV=null}
  p.x=Math.min(Math.max(p.x,10),W-10);p.y=Math.min(Math.max(p.y,H*.3),H-20);
  p.inv=Math.max(0,p.inv-dt);G.banner-=dt;G.shake=Math.max(0,G.shake-dt);
  p.ft-=dt;if(p.ft<=0){p.ft=fireInt();shoot()}

  const n=G.lvl,bossKind=BOSS_AT[n];
  if(!bossKind){
    G.wt+=dt;G.st-=dt;
    if(G.st<=0&&G.wt<20){spawnEnemy();G.st=Math.max(.26,1.05-n*.08)*rnd(.7,1.3)}
    if(n>=4&&G.wt<20){G.planeT-=dt;if(G.planeT<=0){spawnPlane();G.planeT=rnd(5,9)-n*.3}}
    if(n>=5&&G.wt<20){G.sickleT-=dt;if(G.sickleT<=0){spawnSickle();G.sickleT=rnd(6,10)-n*.3}}
    if(G.wt>=20&&!G.e.some(e=>e.t!=='dealer'))nextLevel();
  }else{
    if(!G.boss&&!G.bossDone){
      if(!G.warned){G.warned=true;G.warn=2.6;G.sirenT=0}
      if(G.warn>0){G.warn-=dt;G.sirenT-=dt;if(G.sirenT<=0){sfx.siren();G.sirenT=.6}if(G.warn<=0)spawnBoss(bossKind)}
    }
    G.candleT-=dt;if(G.boss&&G.candleT<=0){G.candleT=rnd(1.4,2.6);mkE({t:'candle',x:rnd(12,W-12),y:-14,r:5,hp:1,vy:110,score:10,coin:1})}
  }
  // 無敵莊家：L2 起每關隨機出一次
  if(n>=2&&!G.dealerDone&&!bossKind){G.dealerT-=dt;if(G.dealerT<=0){G.dealerDone=true;spawnDealer();floatText(W/2,H*.25,'無敵莊家出現！射不死，快閃開','#FFF',1);sfx.bad()}}

  for(const b of G.b){b.x+=b.vx*dt;b.y+=b.vy*dt}
  G.b=G.b.filter(b=>b.y>-10&&b.x>-10&&b.x<W+10&&!b.dead);

  for(const e of G.e){
    e.hf=Math.max(0,e.hf-dt);
    if(e.t==='candle')e.y+=e.vy*dt;
    else if(e.t==='wick'){e.y+=e.vy*dt;e.x=e.bx+Math.sin(G.t*6+e.ph)*10}
    else if(e.t==='fud'){e.y+=e.vy*dt;e.x=e.bx+Math.sin(G.t*2+e.ph)*e.amp;e.ft-=dt;if(e.ft<=0&&e.y>0&&e.y<H*.6){eShot(e.x,e.y+5,aim(e),75+n*4);e.ft=rnd(1.8,3.2)-Math.min(1,n*.08)}}
    else if(e.t==='bomb'){e.y+=e.vy*dt;e.x=e.bx+Math.sin(G.t*1.2+e.ph)*15;e.ft-=dt;if(e.ft<=0&&e.y>0&&e.y<H*.7){if(n>=3){for(let i=-2;i<=2;i++)eShot(e.x,e.y+10,Math.PI/2+i*.22,70+n*3)}else eShot(e.x,e.y+10,aim(e),75);e.ft=rnd(1.6,2.4)}}
    else if(e.t==='plane'){e.x+=e.vx*dt;e.ft-=dt;if(e.ft<=0){eShot(e.x,e.y+6,Math.PI/2,60+n*5,'bomb');e.ft=.9}if(e.x<-30||e.x>W+30)e.dead=true}
    else if(e.t==='sickle'){e.x+=e.vx*dt;e.rot+=dt*10;if(e.x<-30||e.x>W+30)e.dead=true}
    else if(e.t==='dealer'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;
      if(e.x<12||e.x>W-12){e.vx*=-1;e.x=Math.min(Math.max(e.x,12),W-12)}if(e.y>H*.75||e.y<20)e.vy*=-1;
      if(e.life<=0){e.dead=true;floatText(e.x,e.y,'莊家走了','#A89CD8')}}
    else if(e.t==='boss')bossAI(e,dt,n);
    for(const b of G.b){if(b.dead)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=e.r+2;
      if(dx*dx+dy*dy<rr*rr){b.dead=true;
        if(e.t==='dealer'){e.hf=.08;eShot(b.x,b.y,aim(e)+rnd(-.3,.3),150);sfx.bounce();continue}
        e.hp-=b.dmg;e.hf=.07;if(e.hp<=0&&!e.dead){e.dead=true;kill(e);break}}}
    if(!e.dead){const dx=p.x-e.x,dy=p.y-e.y,rr=e.r+6;if(dx*dx+dy*dy<rr*rr){hurt();if(e.t!=='boss'&&e.t!=='dealer'){e.dead=true;burst(e.x,e.y,'#E8453C',8,80)}}}
    if(mode!=='play')return;
  }
  G.e=G.e.filter(e=>!e.dead&&e.y<H+30);
  if(G.boss&&G.boss.dead)G.boss=null;

  for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;const dx=b.x-p.x,dy=b.y-p.y;if(dx*dx+dy*dy<36){b.dead=true;hurt();if(mode!=='play')return}}
  G.eb=G.eb.filter(b=>!b.dead&&b.y<H+10&&b.y>-20&&b.x>-10&&b.x<W+10);

  const mag=(30+S.up.magnet*26)*G.J.mag*(has('magnet')?2.5:1);
  for(const d of G.d){
    d.t+=dt;const dx=p.x-d.x,dy=p.y-d.y,dist=Math.hypot(dx,dy)||1;
    const pull=d.k==='bad'?mag*.4:d.k==='shiny'?mag*1.5:mag;
    if(dist<pull){d.vx=dx/dist*230;d.vy=dy/dist*230}else{d.vy=Math.min(d.vy+130*dt,d.k==='shiny'?30:55);d.vx*=.96}
    d.x+=d.vx*dt;d.y+=d.vy*dt;
    if(d.k==='shiny'&&Math.random()<.5)G.fx.push({x:d.x+rnd(-6,6),y:d.y+rnd(-6,6),vx:0,vy:-10,life:.4,max:.4,col:pick(['#fff','#FFF0B0','#8CF','#F8C'])});
    if(dist<12){d.dead=true;
      if(d.k==='coin'||d.k==='coinB'){addCoins(d.k==='coinB'?5:1);sfx.coin();if(d.k==='coinB')floatText(d.x,d.y,'+'+5*G.mult,'#FFF0B0')}
      else if(d.k==='bone'){p.hp=Math.min(p.max,p.hp+1);sfx.power();floatText(d.x,d.y,'+1 生命','#FF8FB8')}
      else applyCoin(d)}
  }
  G.d=G.d.filter(d=>!d.dead&&d.y<H+20);
  if(!G.d.some(d=>d.k==='shiny'))G.shinyOn=0;
  for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.94;f.vy*=.94;f.life-=dt}G.fx=G.fx.filter(f=>f.life>0);
  for(const t of G.tx){t.y-=(t.big?8:20)*dt;t.life-=dt}G.tx=G.tx.filter(t=>t.life>0);
}
function bossAI(e,dt,n){
  const top=e.kind==='whale'?70:65;if(e.y<top){e.y+=35*dt;return}
  e.ft-=dt;const c=n/3|0;
  if(e.kind==='bear'){e.x=W/2+Math.sin(G.t*.7)*(W/2-36);
    if(e.ft<=0){const pat=e.pat++%3;
      if(pat===0){const k=7;for(let i=0;i<k;i++)eShot(e.x,e.y+18,Math.PI/2+(i-(k-1)/2)*.17,80+n*2)}
      else if(pat===1){const a=aim(e);for(let i=0;i<3;i++)setTimeout(()=>{if(G&&e.hp>0&&mode==='play')eShot(e.x,e.y+18,a+(i-1)*.08,115+n*2)},i*140)}
      else{const k=12,o=rnd(0,1);for(let i=0;i<k;i++)eShot(e.x,e.y,o+i/k*Math.PI*2,65+n*1.5)}
      e.ft=1.2}}
  else if(e.kind==='whale'){e.x=W/2+Math.sin(G.t*.5)*(W/2-44);
    if(e.ft<=0){const pat=e.pat++%2;
      if(pat===0){for(let i=0;i<8;i++)mkE({t:'candle',x:rnd(8,W-8),y:-14-i*12,r:5,hp:1,vy:150+n*3,score:10,coin:1});floatText(e.x,e.y+30,'大回調！','#E8453C')}
      else{const a=aim(e);for(let i=-2;i<=2;i++)eShot(e.x,e.y+14,a+i*.12,95+n*2)}
      e.ft=1.4}}
  else{e.x+=Math.sign(Math.sin(G.t*1.6))*95*dt;e.x=Math.min(Math.max(e.x,30),W-30);
    if(e.ft<=0){const pat=e.pat++%3;
      if(pat<2){for(const s of[-1,1])for(let i=0;i<3;i++)setTimeout(()=>{if(G&&e.hp>0&&mode==='play')eShot(e.x+s*22,e.y+8,Math.PI/2+s*.15,110+n*2)},i*110)}
      else{const k=14;for(let i=0;i<k;i++)eShot(e.x,e.y,Math.PI*(.1+i/(k-1)*.8),80+n*2);floatText(e.x,e.y+26,'爆倉！','#E8453C')}
      e.ft=.9}}
}

    cx.fillStyle='#FFB8A8';cx.fillRect(x-12,y-2,24,5);cx.globalAlpha=1}
}

  cx.globalAlpha=1;cx.restore();
  if(has('narrow')){cx.fillStyle='rgba(0,0,0,.85)';const r=52;cx.fillRect(0,0,W,Math.max(0,p.y-r));cx.fillRect(0,p.y+r,W,H);cx.fillRect(0,p.y-r,Math.max(0,p.x-r),r*2);cx.fillRect(p.x+r,p.y-r,W,r*2)}

  cx.fillStyle='#000';cx.fillRect(10,H-8,W-20,4);cx.fillStyle='#4B3A8C';cx.fillRect(11,H-7,W-22,2);cx.fillStyle='#F8C838';cx.fillRect(11,H-7,Math.round((W-22)*(G.lvl-1)/(LEVELS-1)),2);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('upList').addEventListener('click',e=>{const b=e.target.closest('[data-up]');if(!b)return;const u=UPS.find(x=>x.k===b.dataset.up),lv=S.up[u.k];
  if(lv>=u.max||S.coins<u.cost[lv])return;S.coins-=u.cost[lv];S.up[u.k]++;save();audio();sfx.buy();toast(u.name+' 升級至 LV'+S.up[u.k]);renderShop()});
$('jetList').addEventListener('click',e=>{const b=e.target.closest('[data-jet]');if(!b)return;const j=jetOf(b.dataset.jet);
  if(!S.jets.includes(j.k)){if(S.coins<j.price)return;S.coins-=j.price;S.jets.push(j.k);audio();sfx.buy();toast('已購買 '+j.name)}S.jet=j.k;save();renderHangar()});
$('bPlay').onclick=start;$('bShop').onclick=()=>{renderShop();show('shop')};$('bShopBack').onclick=goHome;
$('bHangar').onclick=()=>{renderHangar();show('hangar')};$('bHangarBack').onclick=goHome;
$('bGuide').onclick=()=>{renderGuide();show('guide')};$('bGuideBack').onclick=goHome;
$('bBoard').onclick=()=>{renderBoard();show('board')};$('bBoardBack').onclick=goHome;
$('bDaily').onclick=()=>{S.coins+=100;S.daily=today();save();audio();sfx.buy();toast('每日獎勵 +100 幣');refreshHome()};
$('bPause').onclick=pause;$('bResume').onclick=resume;$('bQuit').onclick=goHome;
$('bAgain').onclick=start;$('bHome').onclick=goHome;$('bRevive').onclick=revive;$('bSubmit').onclick=submitScore;
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')submitScore();e.stopPropagation()});

/* ---------- 操作：任何位置拖動 ---------- */
const keys={};let drag=null,dragV=null;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
  if(k==='p'||k==='Escape'){mode==='play'?pause():mode==='pause'&&resume()}if(k.startsWith('Arrow')&&mode==='play')e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
function pd(x,y){if(mode!=='play')return;audio();drag={x,y}}
function pm(x,y){if(!drag||mode!=='play')return;dragV={x:(dragV?dragV.x:0)+(x-drag.x)/SC*1.3,y:(dragV?dragV.y:0)+(y-drag.y)/SC*1.3};drag={x,y}}
function pu(){drag=null;dragV=null}
if(window.PointerEvent){
  app.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,label'))return;pd(e.clientX,e.clientY);try{app.setPointerCapture(e.pointerId)}catch(_){}},{passive:true});
  app.addEventListener('pointermove',e=>pm(e.clientX,e.clientY),{passive:true});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>app.addEventListener(t,pu));
}else{
  app.addEventListener('touchstart',e=>{if(e.target.closest('button,input,label'))return;const t=e.touches[0];pd(t.clientX,t.clientY)},{passive:true});
  app.addEventListener('touchmove',e=>{const t=e.touches[0];pm(t.clientX,t.clientY)},{passive:true});
  ['touchend','touchcancel'].forEach(t=>app.addEventListener(t,pu));
  app.addEventListener('mousedown',e=>pd(e.clientX,e.clientY));app.addEventListener('mousemove',e=>pm(e.clientX,e.clientY));addEventListener('mouseup',pu);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- 主迴圈 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(G){if(mode==='play'){update(dt);if(G)hud()}if(G)render()}else drawHomeBg(dt*.5);
  requestAnimationFrame(loop);
}
addEventListener('resize',resize);resize();initSprites();
refreshHome();show('home');requestAnimationFrame(loop);
})();
</script>
